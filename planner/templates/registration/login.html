{% extends "base.html" %}

{% block title %}Logowanie{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center auth-wrapper">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
    <div class="card">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-4 text-center">Zaloguj się</h1>

        {% if form.errors %}
          <div class="alert alert-danger py-2">Nieprawidłowy login lub hasło.</div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label for="id_username" class="form-label">Login</label>
            <input type="text" name="username" id="id_username"
                   class="form-control form-control-lg"
                   value="{{ form.username.value|default:'' }}" required autofocus>
          </div>

          <div class="mb-4">
            <label for="id_password" class="form-label">Hasło</label>
            <input type="password" name="password" id="id_password"
                   class="form-control form-control-lg" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100">Zaloguj się</button>
        </form>

        <p class="text-center mt-4 mb-0">
          Nie masz konta? <a href="{% url 'register' %}">Zarejestruj się</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
