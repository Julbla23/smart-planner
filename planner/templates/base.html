{% load static %}
<!doctype html>
<html lang="pl">
{% block extra_head %}{% endblock %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Planner{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --roz: #d63384;           /* róż paska nawigacji */
    --puder: #f4c2c2;         /* pudrowy róż przycisków */
    --puder-ciemny: #e8a5a5;  /* trochę ciemniejszy, po najechaniu myszką */
    --tekst: #5a2a35;         /* ciemny tekst na przyciskach */
  }

  .navbar-pink { background-color: var(--roz); }
.navbar-pink .nav-link { color: rgba(255, 255, 255, 0.9); }
.navbar-pink .nav-link:hover { color: #fff; }
  .btn-primary {
    --bs-btn-bg: var(--puder);
    --bs-btn-border-color: var(--puder);
    --bs-btn-color: var(--tekst);
    --bs-btn-hover-bg: var(--puder-ciemny);
    --bs-btn-hover-border-color: var(--puder-ciemny);
    --bs-btn-hover-color: var(--tekst);
    --bs-btn-active-bg: var(--puder-ciemny);
    --bs-btn-active-border-color: var(--puder-ciemny);
    --bs-btn-active-color: var(--tekst);
    --bs-btn-focus-shadow-rgb: 244, 194, 194;
  }

  .btn-outline-primary {
    --bs-btn-color: #b5536a;
    --bs-btn-border-color: var(--puder);
    --bs-btn-hover-bg: var(--puder);
    --bs-btn-hover-border-color: var(--puder);
    --bs-btn-hover-color: var(--tekst);
    --bs-btn-active-bg: var(--puder-ciemny);
    --bs-btn-active-border-color: var(--puder-ciemny);
    --bs-btn-active-color: var(--tekst);
    --bs-btn-focus-shadow-rgb: 244, 194, 194;
  }
  /* ===== Priorytety ===== */
  :root {
    --prio-high: #c2185b;     /* malinowy */
    --prio-medium: #f4a26b;   /* brzoskwiniowy */
    --prio-low: #7fcfae;      /* miętowy */
  }

  /* kolorowy pasek z lewej strony zadania */
  .priority-high   { box-shadow: inset 4px 0 0 var(--prio-high);   padding-left: 0.75rem; }
  .priority-medium { box-shadow: inset 4px 0 0 var(--prio-medium); padding-left: 0.75rem; }
  .priority-low    { box-shadow: inset 4px 0 0 var(--prio-low);    padding-left: 0.75rem; }

  /* plakietka z nazwą priorytetu */
  .badge-priority-high   { background-color: var(--prio-high); color: #fff; }
  .badge-priority-medium { background-color: #fde0cc; color: #7a3e1d; }
  .badge-priority-low    { background-color: #d9f3e8; color: #1f5c45; }
</style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-md navbar-dark navbar-pink mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">Smart Planner</a>
      {% if user.is_authenticated %}
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="{% url 'home' %}">Dziś</a>
        <a class="nav-link" href="{% url 'calendar' %}">Kalendarz</a>
        <a class="nav-link" href="{% url 'show_weekly_statistics' %}">Statystyki</a>
        <a class="nav-link" href="{% url 'ai_kroki' %}">✨ Rozbij cel</a>
      </div>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm">Wyloguj</button>
      </form>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
