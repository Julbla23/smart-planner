{% extends "base.html" %}

{% block title %}Strona główna{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card p-4 p-md-5 text-center">

      <h1 class="mb-1">Witaj, {{ user.username }} 👋</h1>
      <p class="text-muted fs-5 mb-4">Co dziś robimy?</p>

      <div class="d-grid gap-2 mb-4">
        <a class="btn btn-primary btn-lg" href="{% url 'task_list' %}">Wyświetl taski</a>
        <a class="btn btn-primary btn-lg" href="{% url 'add_task' %}">Dodaj taska</a>
        <a class="btn btn-outline-primary btn-lg" href="{% url 'ai_kroki' %}">✨ Rozbij cel</a>
        <a class="btn btn-outline-primary btn-lg" href="{% url 'calendar' %}">Pokaż kalendarz</a>
      </div>

      <h2 class="h5 mb-3">Statystyki</h2>
      <div class="d-flex justify-content-center flex-wrap gap-2">
        <a class="btn btn-outline-primary" href="{% url 'show_weekly_statistics' %}">Tygodniowe</a>
        <a class="btn btn-outline-primary" href="{% url 'show_monthly_statistics' %}">Miesięczne</a>
        <a class="btn btn-outline-primary" href="{% url 'show_quarterly_statistics' %}">Kwartalne</a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
