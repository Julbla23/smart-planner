{% extends "base.html" %}

{% block title %}Strona główna{% endblock %}

{% block content %}
<h1>Witaj</h1>
<h3 class="mb-4">Co dziś robimy?</h3>

<div class="d-grid gap-2 col-md-6">
  <a class="btn btn-primary" href="{% url 'task_list' %}">Wyświetl taski</a>
  <a class="btn btn-primary" href="{% url 'add_task' %}">Dodaj taska</a>
  <a class="btn btn-outline-primary" href="{% url 'ai_kroki' %}">✨ Rozbij cel</a>
  <a class="btn btn-outline-primary" href="{% url 'calendar' %}">Pokaż kalendarz</a>
</div>

<h5 class="mt-4">Statystyki</h5>
<div class="d-flex gap-2">
  <a class="btn btn-outline-primary" href="{% url 'show_weekly_statistics' %}">Tygodniowe</a>
  <a class="btn btn-outline-primary" href="{% url 'show_monthly_statistics' %}">Miesięczne</a>
  <a class="btn btn-outline-primary" href="{% url 'show_quarterly_statistics' %}">Kwartalne</a>
</div>
{% endblock %}
